<div class="register-container">
  <h2>Registro de Usuario</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" />
      <span class="error" *ngIf="nombre?.invalid && nombre?.touched">Nombre es requerido</span>
    </div>

    <div class="form-group">
      <label>Apellido</label>
      <input type="text" formControlName="apellido" />
      <span class="error" *ngIf="apellido?.invalid && apellido?.touched">Apellido es requerido</span>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" />
      <span class="error" *ngIf="email?.invalid && email?.touched">Email inválido</span>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password" />
      <span class="error" *ngIf="password?.invalid && password?.touched">Contraseña mínima 6 caracteres</span>
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select formControlName="rol">
        <option value="">Seleccionar rol</option>
        <option [value]="UserRole.ADMIN_GLOBAL">Administrador Global</option>
        <option [value]="UserRole.ADMIN_INSTITUCION">Administrador Institución</option>
        <option [value]="UserRole.VENDEDOR">Vendedor</option>
        <option [value]="UserRole.COMPRADOR">Comprador</option>
      </select>
      <span class="error" *ngIf="rol?.invalid && rol?.touched">Rol es requerido</span>
    </div>

    <div class="form-group" *ngIf="showInstitucionField">
      <label>Institución</label>
      <select formControlName="institucion_id">
        <option value="">Seleccionar institución</option>
        <option *ngFor="let i of instituciones" [value]="i.id">{{ i.nombre }}</option>
      </select>
      <span class="error" *ngIf="institucion_id?.invalid && institucion_id?.touched">Institución requerida</span>
    </div>

    <div class="form-group">
      <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Registrando...' : 'Registrarse' }}</button>
    </div>

    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </form>

  <p class="login-link">
    ¿Ya tienes cuenta? <a (click)="goToLogin()">Inicia sesión</a>
  </p>
</div>
