<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <div class="logo">
        <span class="logo-icon">🎲</span>
        <h1>Rifas Solidarias</h1>
      </div>
      <p class="subtitle">Crea tu cuenta</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          placeholder="Tu nombre"
          [class.error]="nombre?.invalid && nombre?.touched"
        />
        <div class="error-message" *ngIf="nombre?.invalid && nombre?.touched">
          <span *ngIf="nombre?.errors?.['required']">El nombre es requerido</span>
        </div>
      </div>

      <!-- Apellido -->
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          formControlName="apellido"
          placeholder="Tu apellido"
          [class.error]="apellido?.invalid && apellido?.touched"
        />
        <div class="error-message" *ngIf="apellido?.invalid && apellido?.touched">
          <span *ngIf="apellido?.errors?.['required']">El apellido es requerido</span>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.error]="email?.invalid && email?.touched"
        />
        <div class="error-message" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">El email es requerido</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          [class.error]="password?.invalid && password?.touched"
        />
        <div class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <!-- Rol -->
      <div class="form-group">
        <label for="rol">Tipo de Usuario</label>
        <select
          id="rol"
          formControlName="rol"
          [class.error]="rol?.invalid && rol?.touched"
        >
          <option value="">Selecciona tu rol</option>
          <option value="comprador">Comprador</option>
          <option value="vendedor">Vendedor</option>
          <option value="admin_institucion">Administrador de Institución</option>
          <option value="admin_global">Administrador Global</option>
        </select>
        <div class="error-message" *ngIf="rol?.invalid && rol?.touched">
          <span *ngIf="rol?.errors?.['required']">Selecciona un tipo de usuario</span>
        </div>
      </div>

      <!-- Institución (solo si es vendedor o admin_institucion) -->
      <div class="form-group" *ngIf="showInstitucionField">
        <label for="institucion_id">Institución</label>
        <select
          id="institucion_id"
          formControlName="institucion_id"
          [class.error]="institucion_id?.invalid && institucion_id?.touched"
        >
          <option value="">Selecciona una institución</option>
          <option *ngFor="let inst of instituciones" [value]="inst.id">
            {{ inst.nombre }}
          </option>
        </select>
        <div class="error-message" *ngIf="institucion_id?.invalid && institucion_id?.touched">
          <span *ngIf="institucion_id?.errors?.['required']">Selecciona una institución</span>
        </div>
      </div>

      <!-- Error general -->
      <div class="error-message global-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Botón de envío -->
      <button
        type="submit"
        class="register-btn"
        [disabled]="isLoading || registerForm.invalid"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <div class="register-footer">
      <p>¿Ya tienes cuenta? 
        <button type="button" class="link-btn" (click)="goToLogin()">
          Inicia sesión aquí
        </button>
      </p>
      <button type="button" class="link-btn" (click)="goToHome()">
        ← Volver al inicio
      </button>
    </div>
  </div>
</div>
