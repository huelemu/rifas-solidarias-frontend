<app-navbar></app-navbar>

<div class="page-container">
  <div class="page-main">

    <!-- Estadísticas compactas -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🎫</div>
        <div class="stat-content">
          <div class="stat-number">{{ rifas().length }}</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-content">
          <div class="stat-number">{{ getActivasCount() }}</div>
          <div class="stat-label">Activas</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🏁</div>
        <div class="stat-content">
          <div class="stat-number">{{ getFinalizadasCount() }}</div>
          <div class="stat-label">Finalizadas</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-content">
          <div class="stat-number">{{ getBorradorCount() }}</div>
          <div class="stat-label">Borradores</div>
        </div>
      </div>
    </div>

    <!-- Controles y filtros -->
    <div class="controls-section">
      <div class="controls-left">
        <input
          type="text"
          class="search-input"
          placeholder="Buscar rifas..."
          [(ngModel)]="currentFilters().search"
          (ngModelChange)="onFilterChange()">
        
        <select 
          class="filter-select"
          [(ngModel)]="currentFilters().estado"
          (ngModelChange)="onFilterChange()">
          <option value="todas">Todos los estados</option>
          <option *ngFor="let estado of rifaEstados" [value]="estado.value">
            {{ estado.label }}
          </option>
        </select>
      </div>
      
      <div class="controls-right">
        <app-view-toggle></app-view-toggle>
        
        <button class="btn btn-secondary" (click)="recargarRifas()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        
        <button 
          *ngIf="canCreateRifa()" 
          class="btn btn-primary" 
          (click)="crearRifa()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Nueva Rifa
        </button>
      </div>
    </div>

    <!-- Estados de carga -->
    <div *ngIf="loading()" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando rifas...</p>
    </div>

    <div *ngIf="error()" class="error-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <p>{{ error() }}</p>
      <button class="btn btn-secondary" (click)="recargarRifas()">Reintentar</button>
    </div>

    <div *ngIf="!loading() && !error() && rifas().length === 0" class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 7h-9"></path>
        <path d="M14 17H5"></path>
        <circle cx="17" cy="17" r="3"></circle>
        <circle cx="7" cy="7" r="3"></circle>
      </svg>
      <h2>No hay rifas</h2>
      <p>{{ currentFilters().search ? 'No se encontraron resultados' : 'Comienza creando tu primera rifa' }}</p>
      <button *ngIf="canCreateRifa()" class="btn btn-primary" (click)="crearRifa()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Crear Rifa
      </button>
    </div>

    <!-- Vista de tarjetas -->
    <div 
      *ngIf="!loading() && !error() && rifas().length > 0 && (viewMode$ | async) === 'card'" 
      class="rifas-grid">
      <app-rifa-card
        *ngFor="let rifa of rifas()"
        [rifa]="rifa"
        [viewMode]="'card'"
        (delete)="onDeleteRifa($event)">
      </app-rifa-card>
    </div>

    <!-- Vista de lista -->
    <div 
      *ngIf="!loading() && !error() && rifas().length > 0 && (viewMode$ | async) === 'list'" 
      class="rifas-list">
      <app-rifa-card
        *ngFor="let rifa of rifas()"
        [rifa]="rifa"
        [viewMode]="'list'"
        (delete)="onDeleteRifa($event)">
      </app-rifa-card>
    </div>

    <!-- Paginación -->
    <div *ngIf="pagination() && rifas().length > 0" class="pagination">
      <button 
        class="btn-pagination"
        [disabled]="pagination().page === 1"
        (click)="cambiarPagina(pagination().page - 1)">
        Anterior
      </button>
      
      <div class="pagination-pages">
        <button
          *ngFor="let page of getPaginationPages()"
          class="btn-page"
          [class.active]="page === pagination().page"
          (click)="cambiarPagina(page)">
          {{ page }}
        </button>
      </div>
      
      <button 
        class="btn-pagination"
        [disabled]="pagination().page === pagination().totalPages"
        (click)="cambiarPagina(pagination().page + 1)">
        Siguiente
      </button>
    </div>
  </div>
</div>
